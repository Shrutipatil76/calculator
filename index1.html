<html>
    <head>
        <style>
            input[type="button"]
            {
                width: 100%;
                height: 100%;
            }

        </style>
    </head>
        <body>
        <script>
            function cal(val)
            {
                document.getElementById("a").value +=val;
            }
            function clr()
            {
                document.getElementById("a").value = " ";
            }
            function solve()
            {
               var x=document.getElementById("a").value;
               var y=eval(x);
               document.getElementById("a").value=y;
            }
        </script>
            <table>
                <tr>
                    <th colspan="3"><input type="text" id="a">
                    <th><input type="button" value="c" onclick="clr()">
                </tr>
                <tr>
                    <th><input type="button" value="1" onclick="cal(1)">
                    <th><input type="button" value="2" onclick="cal(2)">
                    <th><input type="button" value="3" onclick="cal(3)">
                    <th><input type="button" value="/" onclick="cal('/')">
                </tr>
                <tr>
                    <th><input type="button" value="4" onclick="cal(4)">
                    <th><input type="button" value="5" onclick="cal(5)">
                    <th><input type="button" value="6" onclick="cal(6)">
                    <th><input type="button" value="*" onclick="cal('*')">
                </tr>
                <tr>
                    <th><input type="button" value="7" onclick="cal(7)">
                    <th><input type="button" value="8" onclick="cal(8)">
                    <th><input type="button" value="9" onclick="cal(9)">
                    <th><input type="button" value="-" onclick="cal('-')">
                </tr>
                <tr>
                    <th><input type="button" value="." onclick="cal('.')">
                        <th><input type="button" value="0" onclick="cal(0)">
                        <th><input type="button" value="=" onclick="solve()">
                        <th><input type="button" value="+" onclick="cal('+')">
                </tr>
            </table>
        </body>
    </head>
</html>
